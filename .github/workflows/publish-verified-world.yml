name: Publish verified world tree
on:
  push:
    branches: [codex/part-04-world-buildings]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Assemble verified objects and publish branch
        shell: bash
        run: |
          git clone --depth 1 --branch codex/part-04-world-buildings https://github.com/ImadMashhood/RoadDash.git /tmp/world-publish
          cd /tmp/world-publish
          python3 - <<'PY'
          import os,json,base64,hashlib,subprocess,urllib.request,time,concurrent.futures
          api='https://api.github.com/repos/ImadMashhood/RoadDash'
          def get(path):
              for attempt in range(6):
                  try:
                      request=urllib.request.Request(api+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'RoadDash-verified-publisher'})
                      with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
                  except Exception:
                      if attempt==5:raise
                      time.sleep(2*(attempt+1))
          entries=[e for e in get('/git/trees/d16768db9630ff6925877a54211ca9da3e50102e?recursive=1')['tree'] if e['type']=='blob']
          entries.append({'path':'docs/testing/world-polish/RUN.md','mode':'100644','sha':'f6d806737fa594a65eba99e750357a301584ea1c'})
          def ensure(entry):
              sha=entry['sha']
              if subprocess.run(['git','cat-file','-e',sha],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0:return
              value=get('/git/blobs/'+sha);data=base64.b64decode(value['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              actual=subprocess.check_output(['git','hash-object','-w','--stdin'],input=data).decode().strip()
              assert actual==sha
          with concurrent.futures.ThreadPoolExecutor(max_workers=6)as pool:list(pool.map(ensure,entries))
          parent=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          workflow='.github/workflows/publish-verified-world.yml'
          workflow_sha=subprocess.check_output(['git','rev-parse','HEAD:'+workflow]).decode().strip()
          subprocess.run(['git','read-tree','--empty'],check=True)
          index=b''.join((e['mode']+' '+e['sha']+'\t'+e['path']).encode()+b'\0'for e in entries)
          subprocess.run(['git','update-index','-z','--index-info'],input=index,check=True)
          target=subprocess.check_output(['git','write-tree']).decode().strip()
          assert target=='8a08000dede0418ad4dfe656adadc6d529b355a9',target
          # Keep this workflow unchanged in the bot push. It is removed separately
          # through the authenticated connector after successful publication.
          subprocess.run(['git','update-index','--add','--cacheinfo','100644,'+workflow_sha+','+workflow],check=True)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          commit=subprocess.check_output(['git','commit-tree',tree,'-p',parent,'-m','feat(world): publish validated architecture, surfaces and recovery']).decode().strip()
          helper='/tmp/world-git-credential.py'
          open(helper,'w').write('import os\nprint("username=x-access-token")\nprint("password="+os.environ["GH_TOKEN"])\n')
          subprocess.run(['git','-c','credential.helper=!python3 '+helper,'push','origin',commit+':refs/heads/codex/part-04-world-buildings'],check=True)
          print('Published verified content tree:',target)
          print('Branch commit:',commit)
          PY
