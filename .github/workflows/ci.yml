name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libasound2-dev libudev-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Dynamic vehicle numeric benchmark and simulated soak
        if: runner.os == 'Linux'
        run: cargo test --locked ten_minute_aggressive -- --ignored --nocapture
      - run: cargo build --locked
      - run: cargo run --locked -- --validate-handling content/handling.json
      - run: cargo run --locked -- --validate-track content/tracks/valley.json
      - run: cargo run --locked -- --validate-track content/tracks/handling.json
      - run: cargo check --locked --no-default-features --features offline
      - run: cargo check --locked --features debug_physics
      - run: python tools/sync_progress.py --check
      - run: cargo run --locked -- --validate-world content/world/valley_world_v1.json content/world/building_archetypes_v1.json content/tracks/valley.json --output world-validation.json
      - run: python tools/export_world_plan.py world-validation.json world-plan.svg
      - run: python tools/test_world_inputs.py
      - run: python tools/test_audit.py
      - run: python tools/audit.py --output audit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: declaration-audit-${{ runner.os }}
          path: audit-report.json
